blueprint:
  name: Sync two switches
  description: Synchronize two switches with 100ms de‑bounce delay.
  domain: automation
  input:
    switch_entity1:
      name: Switch 1
      selector:
        entity:
          domain: switch
    switch_entity2:
      name: Switch 2
      selector:
        entity:
          domain: switch

variables:
  switch_entity1: !input switch_entity1
  switch_entity2: !input switch_entity2

trigger:
  - platform: state
    entity_id:
      - !input switch_entity1
      - !input switch_entity2

condition:
  - condition: template
    value_template: >
      {{ trigger.to_state.context.parent_id == none and
         trigger.to_state.state in ['on', 'off'] }}

action:
  # Дебаунс: 100 миллисекунд (0.1 секунды)
  - delay: "00:00:00.1"

  # Обработка Switch 1 → синхронизация Switch 2
  - if:
      - "{{ trigger.entity_id == switch_entity1 }}"
    then:
      - service: >
          {% if trigger.to_state.state == 'on' %}
          switch.turn_on
          {% else %}
          switch.turn_off
          {% endif %}
        data:
          entity_id: "{{ switch_entity2 }}"

  # Обработка Switch 2 → синхронизация Switch 1
  - if:
      - "{{ trigger.entity_id == switch_entity2 }}"
    then:
      - service: >
          {% if trigger.to_state.state == 'on' %}
          switch.turn_on
          {% else %}
          switch.turn_off
          {% endif %}
        data:
          entity_id: "{{ switch_entity1 }}"