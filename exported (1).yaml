blueprint:
  name: Sync up to 5 switches
  description: >
    Synchronizes the state of 2–5 switches: when one is turned on, all turn on;
    when one is turned off, all turn off.
  domain: automation
  input:
    switch_entities:
      name: Switches to sync
      description: Select 2–5 switches to synchronize
      selector:
        entity:
          domain: switch
          multiple: true
  trigger:
    - platform: state
      entity_id: !input switch_entities
      from: 'off'
      to: 'on'
    - platform: state
      entity_id: !input switch_entities
      from: 'on'
      to: 'off'
  condition:
    - condition: template
      value_template: "{{ trigger.to_state.context.parent_id