blueprint:
  name: Test Sync Switches
  description: Minimal test automation
  domain: automation
  input:
    switch_entities:
      name: Test Switches
      selector:
        entity:
          domain: switch
          multiple: true

trigger:
  - platform: state
    entity_id: !input switch_entities

action:
  - service: switch.turn_on
    data:
      entity_id: !input switch_entities
