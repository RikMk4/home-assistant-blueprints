blueprint:
  name: Sync up to 5 switches (with logging)
  description: >
    Synchronizes the state of up to 5 switches. When one changes, others follow (excluding the trigger).
  domain: automation
  input:
    switch_entities:
      name: Switches to sync
      description: Select 2–5 switches to synchronize
      selector:
        entity:
          domain: switch
          multiple: true

variables:
  switch_entities: !input switch_entities

trigger:
  - platform: state
    entity_id: !input switch_entities

condition:
  - condition: template
    value_template: "{{ trigger.to_state.state in ['on', 'off'] }}"

action:
  # 1. Дебаунс: 3 секунды против ложных срабатываний
  - delay: "00:00:03"

  # 2. Логирование начального состояния
  - logger.log:
      message: >
        [Sync Switches] 
        - Trigger entity: {{ trigger.entity_id }}
        - Trigger state: {{ trigger.to_state.state }}
        - All entities: {{ switch_entities | map('str') | join(', ') }}
        - Timestamp: {{ now().strftime('%Y-%m-%d %H:%M:%S') }}
      level: info

  # 3. Сохраняем целевое состояние
  - set_variable:
      target_state: "{{ trigger.to_state.state }}"

  # 4. Фильтруем список: исключаем триггерный переключатель
  - set_variable:
      filtered_switches: >
        {% set trigger_id = trigger.entity_id %}
        {{ switch_entities | map('str') | reject("eq", trigger_id) | list }}

  # 5. Логирование отфильтрованного списка
  - logger.log:
      message: >
        [Sync Switches]
        - Target state: {{ target_state }}
        - Filtered switches (excl. trigger): {{ filtered_switches | join(', ') if filtered_switches else 'none' }}
        - Count: {{ filtered_switches | length }}
      level: info

  # 6. Проверяем, есть ли переключатели для изменения
  - if:
      - "{{ filtered_switches | length > 0 }}"
    then:
      # 7. Применяем состояние к отфильтрованным переключателям
      - service: "switch.turn_{{ target_state }}"
        data:
          entity_id: "{{ filtered_switches | join(',') }}"

      # 8. Логирование успешного выполнения
      - logger.log:
          message: >
            [Sync Switches] Action executed:
            - Service: switch.turn_{{ target_state }}
            - Target entities: {{ filtered_switches | join(', ') }}
            - Status: SUCCESS
          level: info
    else:
      # 9. Логирование пропуска (если нет целей)
      - logger.log:
          message: >
            [Sync Switches] Skipped action:
            - Reason: No target entities (filtered_switches is empty)
            - Status: NO_OP
          level: warning
