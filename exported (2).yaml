- alias: Проходные выключатели (до 5 штук)
  description: >
    Синхронизирует состояние до 5 выключателей: при изменении любого — 
    остальные принимают то же состояние (включено/выключено).
  trigger:
    - platform: state
      entity_id:
        - switch.passage_switch_1
        - switch.passage_switch_2
        - switch.passage_switch_3
        - switch.passage_switch_4
        - switch.passage_switch_5
  action:
    # Если триггерный выключатель стал ON → включаем остальные
    - if:
        condition: state
        entity_id: "{{ trigger.entity_id }}"
        state: "on"
      then:
        - service: homeassistant.turn_on
          target:
            entity_id: >
              {% set trigger_entity = trigger.entity_id %}
              {% set all_switches = [
                'switch.passage_switch_1',
                'switch.passage_switch_2',
                'switch.passage_switch_3',
                'switch.passage_switch_4',
                'switch.passage_switch_5'
              ] %}
              {% set others = all_switches | reject('eq', trigger_entity) | list %}
              {{ others }}
    # Если триггерный выключатель стал OFF → выключаем остальные
    - if:
        condition: state
        entity_id: "{{ trigger.entity_id }}"
        state: "off"
      then:
        - service: homeassistant.turn_off
          target:
            entity_id: >
              {% set trigger_entity = trigger.entity_id %}
              {% set all_switches = [
                'switch.passage_switch_1',
                'switch.passage_switch_2',
                'switch.passage_switch_3',
                'switch.passage_switch_4',
                'switch.passage_switch_5'
              ] %}
              {% set others = all_switches | reject('eq', trigger_entity) | list %}
              {{ others }}
  mode: restart
