blueprint:
  name: Sync four switches
  description: Turn on all switches when any is turned on; turn off all when all are off.
  domain: automation
  input:
    switch_entity1:
      name: Switch 1
      selector:
        entity:
          domain: switch
    switch_entity2:
      name: Switch 2
      selector:
        entity:
          domain: switch
    switch_entity3:
      name: Switch 3
      selector:
        entity:
          domain: switch
    switch_entity4:
      name: Switch 4
      selector:
        entity:
          domain: switch

variables:
  switch_entity1: !input switch_entity1
  switch_entity2: !input switch_entity2
  switch_entity3: !input switch_entity3
  switch_entity4: !input switch_entity4

trigger:
  - platform: state
    entity_id:
      - !input switch_entity1
      - !input switch_entity2
      - !input switch_entity3
      - !input switch_entity4

condition:
  - condition: template
    value_template: >
      {{ trigger.to_state.context.parent_id == none and
         trigger.to_state.state in ['on', 'off'] }}

action:
  # Дебаунс: ждём 3 секунды, чтобы отфильтровать дребезг
  - delay: "00:00:03"

  # Проверяем, есть ли хотя бы один включённый переключатель
  - if:
      - "{{ is_state(switch_entity1, 'on') or
           is_state(switch_entity2, 'on') or
           is_state(switch_entity3, 'on') or
           is_state(switch_entity4, 'on') }}"
    then:
      # Включаем все переключатели
      - service: switch.turn_on
        data:
          entity_id: "{{ switch_entity1 }}"
      - service: switch.turn_on
        data:
          entity_id: "{{ switch_entity2 }}"
      - service: switch.turn_on
        data:
          entity_id: "{{ switch_entity3 }}"
      - service: switch.turn_on
        data:
          entity_id: "{{ switch_entity4 }}"
    else:
      # Выключаем все переключатели
      - service: switch.turn_off
        data:
          entity_id: "{{ switch_entity1 }}"
      - service: switch.turn_off
        data:
          entity_id: "{{ switch_entity2 }}"
      - service: switch.turn_off
        data:
          entity_id: "{{ switch_entity3 }}"
      - service: switch.turn_off
        data:
          entity_id: "{{ switch_entity4 }}"
