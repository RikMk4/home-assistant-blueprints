blueprint:
  name: SНТС 5
  description: >
    Synchronizes the state of up to 5 switches. When one is turned on, all turn on; when one is turned off, all turn off.
  domain: automation
  input:
    switch_entities:
      name: Switches to sync
      description: Select 2–5 switches to synchronize
      selector:
        entity:
          domain: switch
          multiple: true

variables:
  switch_entities: !input switch_entities

trigger:
  - platform: state
    entity_id: !input switch_entities

condition:
  - condition: template
    value_template: "{{ trigger.to_state.state in ['on', 'off'] }}"

action:
  # Дебаунс: 3 секунды против ложных срабатываний
  - delay: "00:00:03"

  # Сохраняем целевое состояние (on/off)
  - set_variable:
      target_state: "{{ trigger.to_state.state }}"

  # Фильтруем список: исключаем триггерный переключатель
  - set_variable:
      filtered_switches: >
        {% set trigger_id = trigger.entity_id %}
        {{ switch_entities | reject("eq", trigger_id) | list }}

  # Применяем состояние ко всем отфильтрованным переключателям
  - service: "switch.turn_{{ target_state }}"
    data:
      entity_id: >
        {% if filtered_switches | length > 0 %}
        {{ filtered_switches | join(',') }}
        {% else %}
        null
        {% endif %}

  # Опционально: логирование (раскомментируйте для отладки)
  # - logger.log:
  #     message: >
  #       [Sync Switches] Trigger: {{ trigger.entity_id }},
  #       Target state: {{ target_state }},
  #       Affected: {{ filtered_switches | join(',') if filtered_switches else 'none' }}
  #     level: info
