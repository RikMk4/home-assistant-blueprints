blueprint:
  name: Sync four switches
  description: Turn on a switch when any of the others is turned on, and vice versa.
  domain: automation
  input:
    switch_entity1:
      name: Switch 1
      selector:
        entity:
          domain: switch
    switch_entity2:
      name: Switch 2
      selector:
        entity:
          domain: switch
    switch_entity3:
      name: Switch 3
      selector:
        entity:
          domain: switch
    switch_entity4:
      name: Switch 4
      selector:
        entity:
          domain: switch

variables:
  switch_entity1: !input switch_entity1
  switch_entity2: !input switch_entity2
  switch_entity3: !input switch_entity3
  switch_entity4: !input switch_entity4

trigger:
  - platform: state
    entity_id:
      - !input switch_entity1
      - !input switch_entity2
      - !input switch_entity3
      - !input switch_entity4

condition:
  - condition: template
    value_template: >
      {{ trigger.to_state.context.parent_id == none and
         trigger.to_state.state in ['on', 'off'] }}

action:
  # Дебаунс: ждём 3 секунды, чтобы отфильтровать дребезг
  - delay: "00:00:03"

  # Обрабатываем каждый выключатель отдельно через взаимоисключающие условия
  - if:
      - "{{ trigger.entity_id == switch_entity1 }}"
    then:
      - service: >
          {% if trigger.to_state.state == 'on' %}
          switch.turn_on
          {% else %}
          switch.turn_off
          {% endif %}
        data:
