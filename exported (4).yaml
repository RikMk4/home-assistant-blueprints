blueprint:
  name: Sync Touch Switches (No Loop)
  description: >
    Synchronizes 2–5 touch switches: when one turns on, all turn on;
    when one turns off, all turn off. Prevents loops via context check.
  domain: automation
  input:
    switch_entities:
      name: Switches to sync
      description: Select 2–5 touch switches to synchronize
      selector:
        entity:
          domain: switch
          multiple: true
  trigger:
    - platform: state
      entity_id: !input switch_entities
      from: 'off'
      to: 'on'
    - platform: state
      entity_id: !input switch_entities
      from: 'on'
      to: 'off'
  condition:
    - condition: template
      value_template: >
        {{ trigger.to_state.context.parent_id is none or
           trigger.to_state.context.parent_id == trigger.context.id }}
  action:
    # Дебаунс: ждём 0.5 сек для стабилизации сигнала
    - delay: 0.5

    # Определяем целевое действие
    - service: >
        {% if trigger.to_state.state == 'on' %}
        switch.turn_on
        {% else %}
        switch.turn_off
        {% endif %}
      data:
        entity_id: "{{ switch_entities }}"