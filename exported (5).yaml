blueprint:
  name: Sync Multiple Switches (2–10)
  description: >
    Synchronizes 2–10 switches: when one turns on, all turn on;
    when one turns off, all turn off. Prevents loops via context check.
  domain: automation
  input:
    switch_entities:
      name: Switches to sync
      description: Select 2–10 switches to synchronize
      selector:
        entity:
          domain: switch
          multiple: true
  trigger:
    - platform: state
      entity_id: !input switch_entities
      from: 'off'
      to: 'on'
    - platform: state
      entity_id: !input switch_entities
      from: 'on'
      to: 'off'
  condition:
    - condition: template
      value_template: "{{ trigger.to_state.context.parent_id == none }}"
  action:
    - wait_template: "{{ (as_timestamp(now()) - as_timestamp(trigger.to_state.last_changed) | int) > 3 }}"
      timeout: 3
    - service: >
        {% if trigger.to_state.state == 'on' %}
        switch.turn_on
        {% else %}
        switch.turn_off
        {% endif %}
      data:
        entity_id: "{{ switch_entities }}"
