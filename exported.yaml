blueprint:
  name: Sync up to 5 switches
  description: >
    Synchronizes the state of up to 5 switches. When one is turned on, all turn on; when one is turned off, all turn off.
  domain: automation
  input:
    switch_entities:
      name: Switches to sync
      description: Select 2–5 switches to synchronize
      selector:
        entity:
          domain: switch
          multiple: true

variables:
  switch_entities: !input switch_entities

trigger:
  - platform: state
    entity_id: !input switch_entities

condition:
  - condition: template
    value_template: "{{ trigger.to_state.state in ['on', 'off'] }}"

action:
  # Дебаунс: 0.5 сек
  - delay: "00:00:00.500"

  # Определяем целевое состояние
  - set_variable:
      target_state: "{{ trigger.to_state.state }}"

  # Применяем ко всем переключателям КРОМЕ триггерного
  - repeat:
      for_each: >
        {% set trigger_id = trigger.entity_id %}
        {{ switch_entities | reject("eq", trigger_id) | list }}
      do:
        - service: "switch.turn_{{ target_state }}"
          data:
            entity_id: "{{ repeat.item }}"
