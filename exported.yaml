blueprint:
  name: Sync up to 5 switches
  description: >
    Synchronizes the state of up to 5 switches: when one is turned on, all turn on; when one is turned off, all turn off.
  domain: automation
  input:
    switch_entities:
      name: Switches to sync
      description: Select 2–5 switches to synchronize
      selector:
        entity:
          domain: switch
          multiple: true
variables:
  switch_entities: !input switch_entities
trigger:
  - platform: state
    entity_id: !input switch_entities
condition:
  - condition: template
    value_template: "{{ trigger.to_state.state in ['on', 'off'] }}"
action:
  - delay: 00:00:00.50
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ trigger.to_state.state == 'on' }}"
        sequence:
          - repeat:
              count: 1
              while: false  # временная заглушка, чтобы избежать вложенности
              # просто итерируем списком и включаем
              sequence:
                - service: switch.turn_on
                  data:
                    entity_id: >
                      {{ switch_entities | join(',') }}
      - conditions:
          - condition: template
            value_template: "{{ trigger.to_state.state == 'off' }}"
        sequence:
          - repeat:
              count: 1
              while: false
              sequence:
                - service: switch.turn_off
                  data:
                    entity_id: >
                      {{ switch_entities | join(',') }}