blueprint:
  name: Sync two switches
  description: Turn on a switch when the other is turned on and vice versa
  domain: automation
  input:
    switch_entity1:
      name: Switch 1
      selector:
        entity:
          domain: switch
    switch_entity2:
      name: Switch 2
      selector:
        entity:
          domain: switch
variables:
  switch_entity1: !input switch_entity1
  switch_entity2: !input switch_entity2
trigger:
  - platform: state
    entity_id:
      - !input switch_entity1
      - !input switch_entity2
condition: "{{ trigger.to_state.state in ['on', 'off'] }}"
action:
  - delay: 0.5
  - service: >
      {% if trigger.to_state.state == 'on' %}
      switch.turn_on
      {% else %}
      switch.turn_off
      {% endif %}
    data:
      entity_id: >
        {% if trigger.entity_id == switch_entity1 %}
        {{ switch_entity2 }}
        {% else %}
        {{ switch_entity1 }}
        {% endif %}