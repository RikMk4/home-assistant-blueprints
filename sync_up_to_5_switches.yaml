blueprint:
  name: Sync up to 5 switches
  description: >
    Synchronizes the state of up to 5 switches:
    when one is turned on, all turn on; when one is turned off, all turn off.
  domain: automation
  input:
    switch_entities:
      name: Switches to sync
      description: Select 2–5 switches to synchronize
      selector:
        entity:
          domain: switch
          multiple: true
variables:
  switch_entities: !input switch_entities
trigger:
  - platform: state
    entity_id: !input switch_entities
condition:
  - condition: template
    value_template: "{{ trigger.to_state.state in ['on', 'off'] }}"
action:
  # Дебаунс: ждём 0.5 сек, чтобы избежать ложных срабатываний
  - delay: 0.5

  # Применяем действие ко ВСЕМ переключателям, кроме триггерного
  - repeat:
      for_each: "{{ switch_entities }}"
      # исключаем триггерный entity
      while: "{{ repeat.item != trigger.entity_id }}"
      # внутри повторения выполняем нужный сервис для каждого элемента
      sequence:
        - service: >
            {% if trigger.to_state.state == 'on' %}
            switch.turn_on
            {% else %}
            switch.turn_off
            {% endif %}
          data:
            entity_id: "{{ repeat.item }}"